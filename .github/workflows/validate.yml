name: Validate website

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Hugo site
    runs-on: ubuntu-latest
    container:
      image: eclipsefdn/hugo-node:h0.144.2-n22.14.0

    steps:
      - name: Check out website and theme
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify pinned Hugo version
        shell: bash
        run: |
          hugo version
          hugo version | grep -F "v$(cat .hugo-version)"
          test "$(git -C themes/hugo-solstice-theme rev-parse HEAD)" = "$(cat .theme-version)"

      - name: Reject obsolete or analytics configuration
        shell: bash
        run: |
          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=public \
            --exclude-dir=themes \
            'io\.github\.coffee-builder|github\.com/coffee-builder|googletagmanager|GTM-[A-Z0-9]+|Jakarta EE Essentials' \
            .; then
            echo "Obsolete project metadata or an analytics identifier was found."
            exit 1
          fi

      - name: Build production site
        run: >-
          hugo
          --minify
          --panicOnWarning
          --cleanDestinationDir
          --baseURL https://example.invalid/

      - name: Validate generated site metadata
        shell: bash
        run: |
          if grep -RInEi \
            'io\.github\.coffee-builder|github\.com/coffee-builder|googletagmanager|GTM-[A-Z0-9]+|Jakarta EE Essentials|Maven Central|stable release|>Download<' \
            public; then
            echo "Generated output contains prohibited Phase 1 content."
            exit 1
          fi

